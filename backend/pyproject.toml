[project]
name = "gsus-demonkoncernen-platform"
version = "0.3.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "I"]
# B008: FastAPI's Depends() idiom. S101: asserts in tests. S311: non-crypto random for demo data.
ignore = ["E501", "B008", "S101", "S311", "UP045", "UP007", "I001", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
